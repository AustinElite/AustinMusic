<svg width="360" height="96" viewBox="0 0 360 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Austin Music logo</title>
  <desc id="desc">A neon waveform orbit mark with the Austin Music wordmark.</desc>
  <defs>
    <linearGradient id="mark" x1="16" y1="16" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6FEEE1"/>
      <stop offset="0.58" stop-color="#8AF7FF"/>
      <stop offset="1" stop-color="#BCC7DE"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.435 0 0 0 0 0.933 0 0 0 0 0.882 0 0 0 0.65 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <path d="M48 11C68.4 11 85 27.6 85 48S68.4 85 48 85 11 68.4 11 48" stroke="url(#mark)" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M15 54C12 34.1 27.4 14 48 14c11.4 0 21.9 5.4 28.4 14" stroke="#6FEEE1" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="3 8" opacity="0.72"/>
    <path d="M23 56h7.2l6.4-19.8L47 70.4 58.5 24.5 66.8 56H73" stroke="url(#mark)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M31 65h34" stroke="#6FEEE1" stroke-width="2.2" stroke-linecap="round" opacity="0.48"/>
    <circle cx="76.5" cy="29" r="5" fill="#6FEEE1"/>
  </g>
  <text x="111" y="51" fill="#6FEEE1" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="36" font-weight="700" letter-spacing="2.4">Austin Music</text>
  <text x="114" y="72" fill="#BCC7DE" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="5">AI MUSIC AGENT</text>
</svg>
